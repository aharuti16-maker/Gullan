<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ئامرازی ئاسان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#F8F9FC;--sf:#fff;--tx:#111827;--mu:#4B5563;--bd:#D1D5DB;--ac:#4338CA;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F1117;--sf:#171A23;--tx:#F3F4F6;--mu:#B6BDC9;--bd:#374151;--ac:#8B8CF8;--on:#0F1117}}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 'Noto Sans Arabic',Tahoma,Arial,sans-serif}
h1{margin:0;padding:16px 5%;font-size:22px;color:var(--ac);background:var(--sf);border-bottom:1px solid var(--bd)}
#tb{display:flex;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd)}
#tb button{flex:none;padding:12px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);font:inherit;cursor:pointer}
#tb button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.pn{max-width:760px;margin:0 auto;padding:24px 5%}
h2{margin:0 0 16px;font-size:20px}
input,select,textarea{box-sizing:border-box;width:100%;padding:10px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.btn{display:inline-block;padding:11px 20px;margin:4px 0;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.r{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.big{font-size:40px;font-weight:700;color:var(--ac);text-align:center}
.w{overflow-x:auto}
table{border-collapse:collapse}
td,th{border:1px solid var(--bd);padding:2px}
td input,th input{width:96px;margin:0;border:0;border-radius:0}
th{font-size:14px;white-space:nowrap;padding:4px 8px}
#fcard{width:100%;min-height:140px;padding:20px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);font:inherit;font-size:20px;cursor:pointer}
img.pv{max-width:100%;border-radius:10px;margin-top:8px}
.m{color:var(--mu);font-size:14px}
@media print{h1,#tb,.np,.pn[id!="tt"]{display:none!important}}
</style>
</head>
<body>
<h1>ئامرازی ئاسان</h1>
<nav id="tb">
<button data-t="gp" class="on">مەعدەل</button><button data-t="tt">خشتەی وانە</button><button data-t="st">خوێندن</button><button data-t="pd">وێنە بۆ PDF</button><button data-t="cm">کەمکردنەوەی وێنە</button><button data-t="qr">QR</button>
</nav>

<section class="pn" id="gp">
<h2>ژماردنی مەعدەل</h2>
<p class="m">نمرە بە هەمان سیستەمی زانکۆکەت بنووسە (١٠٠ یان ٤.٠)، ئەنجامەکەش بەو شێوەیە دەبێت.</p>
<div id="gl"></div>
<button class="btn o" onclick="addRow()">+ وانە</button>
<div class="m">مەعدەل</div><div class="big" id="gr">—</div>
</section>

<section class="pn" id="tt" hidden>
<h2>خشتەی وانە</h2>
<div class="w"><table id="ttb"></table></div>
<button class="btn np" onclick="print()">چاپکردن / هەڵگرتن وەک PDF</button>
<button class="btn o np" onclick="ttClear()">سڕینەوە</button>
</section>

<section class="pn" id="st" hidden>
<h2>فلاشکارد</h2>
<p class="m">هەر دێڕێک: پرسیار | وەڵام</p>
<textarea id="fct" rows="4" placeholder="Hello | سڵاو"></textarea>
<button class="btn" onclick="buildDeck()">دەست پێبکە</button>
<button id="fcard" onclick="fl=!fl;showCard()">—</button>
<div class="m" id="fcn"></div>
<button class="btn o" onclick="if(deck.length){fi=(fi+1)%deck.length;fl=false;showCard()}">دواتر</button>
<h2 style="margin-top:28px">Pomodoro</h2>
<input id="pm" type="number" value="25" min="1" style="width:100px"> <span class="m">خولەک</span>
<div class="big" id="pt">25:00</div>
<div class="m" id="pdn" style="text-align:center"></div>
<button class="btn" onclick="pStart()">دەستپێکردن</button>
<button class="btn o" onclick="pPause()">وەستان</button>
<button class="btn o" onclick="pReset()">ڕێکخستنەوە</button>
</section>

<section class="pn" id="pd" hidden>
<h2>وێنە بۆ PDF</h2>
<input id="pdfi" type="file" accept="image/*" multiple>
<div class="m" id="pdfn"></div>
<button class="btn" id="pdfc">دروستکردنی PDF</button>
<button class="btn o" id="pdfr">پاککردنەوە</button>
</section>

<section class="pn" id="cm" hidden>
<h2>کەمکردنەوەی قەبارەی وێنە</h2>
<input id="cmi" type="file" accept="image/*">
<label>کوالیتی: <span id="cmqv">70%</span></label>
<input id="cmq" type="range" min="0.1" max="1" step="0.05" value="0.7">
<select id="cmw"><option value="0">قەبارەی ڕەسەن</option><option value="1600">گەورەترین ١٦٠٠px</option><option value="1200">١٢٠٠px</option><option value="800">٨٠٠px</option></select>
<div class="m" id="cms"></div>
<a class="btn" id="cmd" hidden>داگرتن</a>
<img class="pv" id="cmp" alt="">
</section>

<section class="pn" id="qr" hidden>
<h2>دروستکەری QR</h2>
<select id="qt"><option value="t">لینک یان دەق</option><option value="wa">WhatsApp</option><option value="wifi">Wi-Fi</option></select>
<input id="q1" placeholder="لینک یان دەق" dir="ltr">
<input id="q2" placeholder="وشەی نهێنی (پاسۆرد)" dir="ltr" hidden>
<button class="btn" id="qg">دروستکردن</button>
<div id="qo" style="margin:12px 0"></div>
<a class="btn o" id="qd" hidden>داگرتنی وێنە</a>
</section>

<script>
const $=id=>document.getElementById(id);
const S={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const kb=n=>n>1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';
document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tb button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pn').forEach(p=>p.hidden=p.id!==b.dataset.t)});

/* مەعدەل */
function addRow(){const d=document.createElement('div');d.className='r';d.innerHTML='<input placeholder="وانە"><input type="number" placeholder="کرێدیت" min="0" step="any"><input type="number" placeholder="نمرە" min="0" step="any">';$('gl').appendChild(d)}
function gpa(){let s=0,c=0;document.querySelectorAll('#gl .r').forEach(r=>{const i=r.querySelectorAll('input'),cr=+i[1].value;if(cr>0&&i[2].value!==''){s+=cr*(+i[2].value);c+=cr}});$('gr').textContent=c?(s/c).toFixed(2):'—'}
$('gl').addEventListener('input',gpa);addRow();addRow();addRow();

/* خشتەی وانە */
const D=['شەممە','یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە'];
function ttBuild(){let h='<tr><th></th>';for(let c=0;c<6;c++)h+='<th><input data-k="h'+c+'" placeholder="کات"></th>';h+='</tr>';
  D.forEach((d,r)=>{h+='<tr><th>'+d+'</th>';for(let c=0;c<6;c++)h+='<td><input data-k="'+r+'_'+c+'"></td>';h+='</tr>'});
  $('ttb').innerHTML=h;let v={};try{v=JSON.parse(S.g('tt')||'{}')}catch(e){}
  $('ttb').querySelectorAll('input').forEach(i=>i.value=v[i.dataset.k]||'')}
$('ttb').addEventListener('input',()=>{const v={};$('ttb').querySelectorAll('input').forEach(i=>{if(i.value)v[i.dataset.k]=i.value});S.s('tt',JSON.stringify(v))});
function ttClear(){if(confirm('هەموو خشتەکە بسڕدرێتەوە؟')){S.s('tt','{}');ttBuild()}}
ttBuild();

/* فلاشکارد */
let deck=[],fi=0,fl=false;
function buildDeck(){S.s('fc',$('fct').value);deck=$('fct').value.split('\n').map(l=>l.split('|')).filter(a=>a.length>1&&a[0].trim()).map(a=>[a[0].trim(),a.slice(1).join('|').trim()]);fi=0;fl=false;showCard()}
function showCard(){$('fcard').textContent=deck.length?(fl?deck[fi][1]:deck[fi][0]):'—';$('fcn').textContent=deck.length?(fi+1)+' / '+deck.length:''}
$('fct').value=S.g('fc')||'';

/* Pomodoro */
let pt=null,left=1500;
function pd(){const m=Math.floor(left/60),s=left%60;$('pt').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function pStart(){if(pt||left<=0)return;$('pdn').textContent='';pt=setInterval(()=>{left--;pd();if(left<=0){pPause();$('pdn').textContent='کاتەکە تەواو بوو!';beep()}},1000)}
function pPause(){clearInterval(pt);pt=null}
function pReset(){pPause();left=(+$('pm').value||25)*60;$('pdn').textContent='';pd()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},800)}catch(e){}}
$('pm').onchange=pReset;

/* یارمەتی وێنە */
const load=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ئەم وێنەیە ناکرێتەوە'));i.src=URL.createObjectURL(f)});
function draw(im,max,q){let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  return{c,w,h,u:c.toDataURL('image/jpeg',q)}}

/* وێنە بۆ PDF */
let pf=[];
$('pdfi').onchange=e=>{pf=pf.concat([...e.target.files]);e.target.value='';$('pdfn').textContent=pf.length+' وێنە هەڵبژێردراوە'};
$('pdfr').onclick=()=>{pf=[];$('pdfn').textContent=''};
$('pdfc').onclick=async()=>{if(!pf.length)return;const b=$('pdfc');b.disabled=true;b.textContent='...';
  try{const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();
    for(let i=0;i<pf.length;i++){const r=draw(await load(pf[i]),2000,.85);if(i)d.addPage();const s=Math.min((W-40)/r.w,(H-40)/r.h);d.addImage(r.u,'JPEG',(W-r.w*s)/2,(H-r.h*s)/2,r.w*s,r.h*s)}
    d.save('images.pdf')}catch(x){alert('هەڵە: '+x.message)}
  b.disabled=false;b.textContent='دروستکردنی PDF'};

/* کەمکردنەوەی وێنە */
let cf=null,cim=null;
$('cmi').onchange=async e=>{cf=e.target.files[0];if(!cf)return;try{cim=await load(cf);cmp()}catch(x){alert(x.message)}};
function cmp(){if(!cim)return;const q=+$('cmq').value,r=draw(cim,+$('cmw').value||99999,q);$('cmqv').textContent=Math.round(q*100)+'%';
  r.c.toBlob(b=>{$('cms').textContent='پێشوو: '+kb(cf.size)+'  ←  دوای: '+kb(b.size);const u=URL.createObjectURL(b);$('cmp').src=u;$('cmd').href=u;$('cmd').download='compressed.jpg';$('cmd').hidden=false},'image/jpeg',q)}
$('cmq').oninput=cmp;$('cmw').onchange=cmp;

/* QR */
function qf(){const t=$('qt').value;$('q2').hidden=t!=='wifi';$('q1').placeholder=t==='wa'?'+9647501234567':t==='wifi'?'ناوی Wi-Fi':'لینک یان دەق'}
$('qt').onchange=qf;
$('qg').onclick=()=>{const t=$('qt').value,a=$('q1').value.trim();if(!a)return;const e=s=>s.replace(/([\\;,:"])/g,'\\$1');let v=a;
  if(t==='wa')v='https://wa.me/'+a.replace(/\D/g,'');if(t==='wifi')v='WIFI:T:WPA;S:'+e(a)+';P:'+e($('q2').value)+';;';
  $('qo').innerHTML='';new QRCode($('qo'),{text:v,width:240,height:240});
  setTimeout(()=>{const c=$('qo').querySelector('canvas');if(c){$('qd').href=c.toDataURL('image/png');$('qd').download='qr.png';$('qd').hidden=false}},150)};
</script>
</body>
</html>
